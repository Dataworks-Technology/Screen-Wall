# Screen Wall shows arbitrary web pages, so it needs Chromium security fixes:
# keep its pinned Electron (and build tool) current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
