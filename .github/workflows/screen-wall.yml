name: Screen Wall

# Every pull request and push to main tests and builds the Windows installer.
# Running it by hand from main (Actions > Screen Wall > Run workflow) also
# publishes that build as a GitHub Release, tagged v<version>. The app's
# update button (Settings > Updates) installs from those releases.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (auto reads the commits since the last release)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: screen-wall-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows-build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # full history and tags, to work out the next version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The tag is the record of the version; package.json is stamped for this
      # build only, so the app reports the right version without a commit to main.
      - name: Set release version
        id: version
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          version="$(node release.js "$RELEASE_TYPE")"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Screen Wall $version ($RELEASE_TYPE)" >> "$GITHUB_STEP_SUMMARY"

      # Builds that are not releases get a version of their own (1.0.0-build.42),
      # so the control page shows exactly which build a laptop is running.
      - name: Set build version
        if: steps.version.outputs.version == ''
        shell: bash
        run: npm version "$(node -p "require('./package.json').version")-build.${GITHUB_RUN_NUMBER}" --no-git-tag-version

      - name: Build installer
        run: npm run dist -- --win

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-wall-windows
          path: dist/Screen-Wall-Setup-*.exe
          if-no-files-found: error

  release:
    if: needs.windows-build.outputs.version != ''
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screen-wall-windows
          path: app

      # The tag is created with the release, after the build has succeeded, so
      # a failed build never leaves a tag behind.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows-build.outputs.version }}
        run: |
          installer="Screen-Wall-Setup-${VERSION}.exe"
          test -f "app/$installer"
          (cd app && sha256sum "$installer" > "$installer.sha256")
          {
            echo "Run \`$installer\` on the laptop. Running a newer one over an existing install upgrades it and keeps its settings."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "app/$installer.sha256")\`"
            echo
            echo "## Changes"
            node release.js notes
          } > notes.md
          gh release create "v${VERSION}" "app/$installer" "app/$installer.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Screen Wall ${VERSION}" \
            --notes-file notes.md
